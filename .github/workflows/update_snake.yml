name: Generate Snake

on:
  schedule:
    # Chạy mỗi 24 giờ
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
    - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    # Ép hệ thống chạy trên môi trường mới nhất năm 2026
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      # Nâng cấp lên v4 (bản ổn định nhất hiện tại)
      - name: Checkout
        uses: actions/checkout@v4

      # Nâng cấp lên v3 của con rắn (hỗ trợ Node mới)
      - name: Generate Snake
        uses: Platane/snk@v3
        with:
          github_user_name: Hiephvnb02
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      # Dùng lệnh Shell thuần túy để đẩy code (bất tử, không lo lỗi thời)
      - name: Push to Output Branch
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan output || git checkout output
          git rm -rf .
          cp dist/github-contribution-grid-snake.svg .
          cp dist/github-contribution-grid-snake-dark.svg .
          git add .
          git commit -m "Update snake animation [skip ci]" || echo "No changes to commit"
          git push -f origin output
