name: Generate Snake

on:
  schedule:
    # Chạy mỗi 24 giờ
    - cron: "0 0 * * *"
  workflow_dispatch:
  # Chạy mỗi khi bạn push code mới lên branch main
  push:
    branches:
    - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      # Bước 1: Checkout repo
      - name: Checkout
        uses: actions/checkout@v4

      # Bước 2: Chạy bot vẽ rắn (phiên bản mới nhất)
      - name: Generate Snake
        uses: Platane/snk@v3
        with:
          github_user_name: Hiephvnb02
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      # Bước 3: Đẩy file ảnh lên branch output (Cách này sạch sẽ và ít lỗi hơn)
      - name: Push Snake to Output Branch
        uses: crazy-max/github-action-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
