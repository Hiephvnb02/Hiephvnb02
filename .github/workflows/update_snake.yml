name: Generate Snake

on:
  schedule:
    # Chạy mỗi 24 giờ
    - cron: "0 0 * * *"
  workflow_dispatch:
  # Chạy mỗi khi bạn push code mới lên branch main
  push:
    branches:
    - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      # Bước 1: Checkout repo
      - name: Checkout
        uses: actions/checkout@v4

      # Bước 2: Chạy bot vẽ rắn (phiên bản mới nhất)
      - name: Generate Snake
        uses: Platane/snk@v3
        with:
          github_user_name: Hiephvnb02
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      # Bước 3: Đẩy file ảnh lên branch output (Cách này sạch sẽ và ít lỗi hơn)
      - name: Push to Output Branch
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan output
          git rm -rf .
          cp dist/github-contribution-grid-snake.svg .
          cp dist/github-contribution-grid-snake-dark.svg .
          git add .
          git commit -m "Update snake animation"
          git push -f origin output
